server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:120m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
        name: UNIS_SESSION_ID

spring:
  application:
    name: unis-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:unis_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

unis:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  sla:
    critical-hours: 4
    high-hours: 24
    medium-hours: 48
    low-hours: 72

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
  level:
    root: INFO
    com.unis: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.springframework.boot.autoconfigure: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.hibernate: WARN
    org.hibernate.engine: WARN
    org.flywaydb: INFO
    com.zaxxer.hikari: WARN

